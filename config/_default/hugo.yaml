######################## default configuration ####################
# Title of your website (required).
title: "Thai Netizen Network"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone: "Asia/Bangkok"
# Defines the minimum amount of words rendered in a summary
summaryLength: 50

######################## theme via Hugo Modules ####################
module:
  imports:
    - path: github.com/cncf/dot-org-hugo-theme

######################## i18n ####################
# Auto-detect Chinese/Japanese/Korean languages in the content for word breaks.
# Thai also has no spaces between words; this flag does not cover Thai but is harmless.
hasCJKLanguage: true
# Set default content directory for multilingual
contentDir: content/th/
# Set fallback if international version is not available
defaultContentLanguage: th
# Thai content lives at root (/), English at /en/
defaultContentLanguageInSubdir: false

######################## privacy & speed ####################
privacy:
  youtube:
    privacyEnhanced: true
  vimeo:
    enableDNT: true

markup:
  goldmark:
    renderer:
      unsafe: true

######################## security: restrict shell-out at build ####################
security:
  exec:
    allow:
      - ^(dart-)?sass(-embedded)?$
      - ^go$
      - ^node$
      - ^npx$
      - ^postcss$
